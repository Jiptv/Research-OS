<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">How Research OS Works</title>
  <desc id="desc">An English infographic explaining how Research OS turns raw research into traceable, reviewable and reusable knowledge.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="0.52" stop-color="#F4F8F5"/>
      <stop offset="1" stop-color="#FBF8EF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#6B7788"/>
    </marker>
    <style>
      .h1 { font: 800 70px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; fill: #162033; letter-spacing: 0; }
      .lead { font: 430 30px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; fill: #536172; letter-spacing: 0; }
      .section { font: 800 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; fill: #162033; letter-spacing: 0; }
      .cardTitle { font: 800 27px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; fill: #162033; letter-spacing: 0; }
      .body { font: 430 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; fill: #566274; letter-spacing: 0; }
      .small { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; fill: #758092; letter-spacing: 0; }
      .whiteTitle { font: 800 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .whiteBody { font: 430 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; fill: #E7EDF9; letter-spacing: 0; }
      .panel { fill: #FFFFFF; stroke: #E1E7F0; stroke-width: 1.5; filter: url(#softShadow); }
      .flatPanel { fill: #FFFFFF; stroke: #E1E7F0; stroke-width: 1.5; }
      .flowArrow { stroke: #6B7788; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .softArrow { stroke: #C9D4E3; stroke-width: 3; fill: none; stroke-dasharray: 8 10; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#background)"/>
  <rect x="110" y="90" width="1580" height="1020" rx="42" fill="#FFFFFF" opacity="0.76"/>

  <g transform="translate(170 155)">
    <text x="0" y="0" class="h1">How Research OS Works</text>
    <text x="2" y="58" class="lead">Research OS turns raw research into traceable, reviewable and reusable knowledge.</text>

    <g transform="translate(1170 -42)">
      <rect x="0" y="0" width="300" height="96" rx="26" fill="#172033"/>
      <circle cx="54" cy="48" r="24" fill="#5B8CFF"/>
      <path d="M42 48 l8 8 l18 -23" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="40" class="whiteTitle" font-size="25">Local first</text>
      <text x="92" y="68" class="whiteBody" font-size="17">Readable files on disk</text>
    </g>
  </g>

  <g transform="translate(170 300)">
    <text x="0" y="-40" class="section">The core flow</text>

    <g transform="translate(0 0)">
      <rect x="0" y="0" width="230" height="174" rx="26" class="panel"/>
      <circle cx="46" cy="46" r="24" fill="#EAF2FF"/>
      <path d="M32 36 h29 M32 48 h21 M32 60 h29" stroke="#3D74FF" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="98" class="cardTitle">Raw input</text>
      <text x="30" y="124" class="body">Interviews, notes,</text>
      <text x="30" y="149" class="body">screenshots, docs</text>
    </g>

    <path class="flowArrow" d="M250 87 H335"/>

    <g transform="translate(355 0)">
      <rect x="0" y="0" width="230" height="174" rx="26" class="panel"/>
      <circle cx="46" cy="46" r="24" fill="#EAF8F1"/>
      <path d="M36 62 V31 h29 v31 M43 42 h15 M43 53 h15" stroke="#20A66A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="98" class="cardTitle">Sources</text>
      <text x="30" y="124" class="body">Original material</text>
      <text x="30" y="149" class="body">stays preserved</text>
    </g>

    <path class="flowArrow" d="M605 87 H690"/>

    <g transform="translate(710 0)">
      <rect x="0" y="0" width="230" height="174" rx="26" class="panel"/>
      <circle cx="46" cy="46" r="24" fill="#FFF5DB"/>
      <path d="M35 48 l10 10 l23 -28 M36 66 h34" stroke="#D99400" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="98" class="cardTitle">Evidence</text>
      <text x="30" y="124" class="body">What happened</text>
      <text x="30" y="149" class="body">before meaning</text>
    </g>

    <path class="flowArrow" d="M960 87 H1045"/>

    <g transform="translate(1065 0)">
      <rect x="0" y="0" width="300" height="174" rx="26" class="panel"/>
      <circle cx="46" cy="46" r="24" fill="#F1ECFF"/>
      <path d="M35 60 C44 33, 58 33, 68 60 M40 49 h24" stroke="#7C5CFF" stroke-width="5" fill="none" stroke-linecap="round"/>
      <text x="30" y="98" class="cardTitle">Patterns and insights</text>
      <text x="30" y="124" class="body">Meaning emerges from</text>
      <text x="30" y="149" class="body">grouped evidence</text>
    </g>
  </g>

  <g transform="translate(170 535)">
    <rect x="0" y="0" width="605" height="254" rx="32" class="flatPanel"/>
    <text x="34" y="52" class="section">Two intake paths</text>
    <g transform="translate(34 84)">
      <rect x="0" y="0" width="248" height="116" rx="22" fill="#F7FAFF" stroke="#D8E4FF"/>
      <text x="24" y="39" class="cardTitle" font-size="24">Project context</text>
      <text x="24" y="70" class="body">Durable knowledge for</text>
      <text x="24" y="96" class="body">future research rounds</text>
    </g>
    <g transform="translate(322 84)">
      <rect x="0" y="0" width="248" height="116" rx="22" fill="#FFF9EA" stroke="#F1D899"/>
      <text x="24" y="39" class="cardTitle" font-size="24">Research rounds</text>
      <text x="24" y="70" class="body">A bounded study with</text>
      <text x="24" y="96" class="body">sources and reviews</text>
    </g>
    <path class="softArrow" d="M282 132 H315"/>
    <text x="34" y="216" class="body">Project knowledge feeds the next round.</text>
    <text x="34" y="242" class="body">Teams do not start from zero.</text>
  </g>

  <g transform="translate(850 520)">
    <rect x="0" y="0" width="730" height="180" rx="34" fill="#172033" filter="url(#softShadow)"/>
    <text x="40" y="58" class="whiteTitle">Human review is the gate</text>
    <text x="40" y="96" class="whiteBody">AI can extract, connect, critique and propose.</text>
    <text x="40" y="130" class="whiteBody">Researchers decide what becomes knowledge.</text>
    <g transform="translate(540 42)">
      <rect x="0" y="0" width="132" height="92" rx="20" fill="#FFFFFF" opacity="0.10"/>
      <text x="26" y="36" class="small" fill="#FFFFFF">APPROVE</text>
      <text x="26" y="64" class="small" fill="#FFFFFF">REVISE</text>
    </g>
  </g>

  <path class="flowArrow" d="M1220 465 C1220 496, 1220 496, 1220 515"/>
  <path class="flowArrow" d="M1220 705 C1220 740, 1168 764, 1120 785"/>

  <g transform="translate(850 815)">
    <rect x="0" y="0" width="330" height="174" rx="26" class="panel"/>
    <circle cx="48" cy="46" r="24" fill="#EAF8F1"/>
    <path d="M34 48 C44 31, 60 31, 70 48 C60 65, 44 65, 34 48 Z M52 48 h1" stroke="#20A66A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="98" class="cardTitle">Current understanding</text>
    <text x="30" y="124" class="body">A living view of what</text>
    <text x="30" y="149" class="body">the team knows now</text>
  </g>

  <path class="flowArrow" d="M1200 890 H1290"/>

  <g transform="translate(1310 815)">
    <rect x="0" y="0" width="270" height="174" rx="26" class="panel"/>
    <circle cx="48" cy="46" r="24" fill="#FFEDEF"/>
    <path d="M36 34 h26 v29 H36 Z M42 43 h14 M42 53 h14 M42 63 h8" stroke="#E45858" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="98" class="cardTitle">Deliverables</text>
    <text x="30" y="124" class="body">Reports, decks and</text>
    <text x="30" y="149" class="body">recommendations</text>
  </g>

  <g transform="translate(170 850)">
    <text x="0" y="-30" class="section">Why it matters</text>
    <rect x="0" y="0" width="560" height="132" rx="28" fill="#F7FAFF" stroke="#D8E4FF"/>
    <text x="30" y="45" class="cardTitle">Not a report repository</text>
    <text x="30" y="78" class="body">Reports are generated from knowledge.</text>
    <text x="30" y="104" class="body">They are not the knowledge itself.</text>
  </g>

  <g transform="translate(170 1022)">
    <rect x="0" y="0" width="406" height="96" rx="24" fill="#F7FAFF" stroke="#D8E4FF"/>
    <text x="26" y="35" class="cardTitle" font-size="24">Traceable</text>
    <text x="26" y="66" class="body">Every claim links back to evidence.</text>
  </g>
  <g transform="translate(624 1022)">
    <rect x="0" y="0" width="406" height="96" rx="24" fill="#F8FFF8" stroke="#CFEEDD"/>
    <text x="26" y="35" class="cardTitle" font-size="24">Reviewable</text>
    <text x="26" y="66" class="body">AI proposes; researchers decide.</text>
  </g>
  <g transform="translate(1078 1022)">
    <rect x="0" y="0" width="502" height="96" rx="24" fill="#FFF9EA" stroke="#F1D899"/>
    <text x="26" y="35" class="cardTitle" font-size="24">Cumulative</text>
    <text x="26" y="66" class="body">Knowledge improves with every research round.</text>
  </g>
</svg>
